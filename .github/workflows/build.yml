name: Build

on:
  # No paths filter on purpose: these jobs are required by branch protection, so
  # they must report on every PR. A path-filtered required check never reports
  # on a docs/web-only PR, which leaves the check "pending" forever and blocks
  # the merge (forcing an admin bypass). Running the Go suite on non-Go PRs is
  # cheap and cached; it is the price of not having to override protection.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: this workflow only reads the repo. Widen per-job if needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref (PR pushes) to save CI minutes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Turn a missing-tmux skip into a hard failure so the real-tmux regression
    # guards (internal/testutil.RequireTmux) can never silently re-skip if the
    # tmux install below breaks. See issue #274.
    env:
      ATRIUM_CI_REQUIRE_TMUX: '1'
    strategy:
      fail-fast: false
      matrix:
        # Atrium is Unix-centric (tmux/PTY/git). macOS catches darwin-specific
        # behavior; Windows stays build-only (tmux/PTY do not apply there).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      # The real-tmux regression guards (see internal/testutil.RequireTmux, #274)
      # must actually run in CI, not self-skip — GitHub runners ship no tmux. With
      # ATRIUM_CI_REQUIRE_TMUX=1 set at the job level, a missing tmux hard-fails,
      # so this install going dark can't silently re-skip the guards. Skip the
      # (network-touching) install if a runner image already ships tmux.
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            echo "tmux already present: $(tmux -V)"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi

      - name: go vet
        run: go vet ./...

      # Fail if go.mod/go.sum are not tidy (stale or missing dependencies).
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # TestSessionDeathStopsProbing drives a real tmux server through a PTY and is
      # environment-sensitive (a local-only integration test); the death-probing
      # logic also has mocked coverage. Skip it here to keep CI deterministic.
      - name: Test with coverage
        run: go test -coverprofile=coverage.out -skip TestSessionDeathStopsProbing ./...

      # Coverage floor. Baseline at introduction was 46.7%; the floor sits a couple
      # points below and should be ratcheted up over time, never down.
      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_FLOOR: '44.0'
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          echo "Total coverage: ${total}% (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t+0 < f+0) ? 1 : 0 }' || {
            echo "::error::Coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          }

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Exercise the real-tmux suite against the OLDEST tmux Atrium claims to support
  # (session/tmux.MinVersion). The `test` job above runs whatever the runner image
  # ships — 3.4 on ubuntu-latest today — so it can never notice a change that needs a
  # newer tmux than the declared floor. That is the claim which rots: someone adds a
  # conf directive or a flag introduced in 3.5, every job stays green, and the README,
  # the doctor gate and the installer all keep promising 3.2.
  #
  # Ubuntu 22.04 ships tmux 3.2a straight from apt — a patch release of the floor
  # itself — so this needs a container but no source build. Pinned to the image rather
  # than to a tmux version because the image is what makes the version reproducible.
  tmux-floor:
    name: Test at the tmux floor (3.2)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    # As in `test`: a missing tmux must hard-fail rather than let RequireTmux skip the
    # very guards this job exists to run.
    env:
      ATRIUM_CI_REQUIRE_TMUX: '1'
    steps:
      # git and ca-certificates are for actions/checkout; the bare image has neither.
      - name: Install tmux and checkout deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tmux git ca-certificates
          tmux -V

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      # Fail loudly if the image ever stops shipping a tmux at the floor: silently
      # testing against something newer would make this whole job decorative.
      - name: Assert the image ships the declared floor
        run: |
          # Read the one home of the number rather than repeating it here.
          floor="$(sed -n 's/^const MinVersion = "\(.*\)"$/\1/p' session/tmux/version.go)"
          [ -n "$floor" ] || { echo "::error::could not read MinVersion from session/tmux/version.go"; exit 1; }
          have="$(tmux -V | sed 's/^tmux //')"
          echo "declared floor: $floor; image tmux: $have"
          case "$have" in
            "$floor"|"$floor"[a-z]) ;;
            *) echo "::error::this job must run at exactly the declared floor ($floor), but the image ships $have"; exit 1 ;;
          esac

      # Only the packages that actually touch tmux — this job is about the tmux
      # version, not a second full suite. TestSessionDeathStopsProbing is skipped for
      # the same reason the `test` job skips it (see the comment there): it drives a
      # real tmux server through a PTY and is environment-sensitive, and the
      # death-probing logic has mocked coverage that runs here regardless.
      - name: Test the tmux-facing packages
        run: go test -skip TestSessionDeathStopsProbing ./session/tmux/... ./internal/testutil/... ./internal/doctor/...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    # See the test job: make a missing tmux hard-fail so the real-tmux guards
    # can't silently re-skip under -race. Issue #274.
    env:
      ATRIUM_CI_REQUIRE_TMUX: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            echo "tmux already present: $(tmux -V)"
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi

      # -shuffle=on surfaces test-order coupling; -race catches data races.
      - name: Test with race detector
        run: go test -race -shuffle=on -skip TestSessionDeathStopsProbing ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME=atrium
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=$BINARY_NAME.exe
          fi
          go build -v -trimpath -o build/${{ matrix.goos }}_${{ matrix.goarch }}/$BINARY_NAME

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: atrium-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ matrix.goos }}_${{ matrix.goarch }}/*
          retention-days: 7
